<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Scrolling technology skills">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".85"><animate attributeName="stop-color" values="#7c3aed;#0891b2;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="10%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="90%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <g id="set" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#e0f2fe" text-anchor="middle">
      <rect x="5" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="60" y="61">React</text>
      <rect x="125" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="180" y="61">Next.js</text>
      <rect x="245" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="300" y="61">TypeScript</text>
      <rect x="365" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="420" y="61">Python</text>
      <rect x="485" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="540" y="61">FastAPI</text>
      <rect x="605" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="660" y="61">PyTorch</text>
      <rect x="725" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="780" y="61">LangChain</text>
      <rect x="845" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="900" y="61">RAG</text>
      <rect x="965" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="1020" y="61">Docker</text>
      <rect x="1085" y="32" width="110" height="46" rx="12" fill="url(#chip)" stroke="#7dd3fc"/><text x="1140" y="61">PostgreSQL</text>
    </g>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="110" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="26s" repeatCount="indefinite"/>
      <use href="#set"/><use href="#set" x="1200"/>
    </g>
    <rect x="0" y="0" width="1200" height="110" fill="url(#fade)"/>
  </g>
</svg>
