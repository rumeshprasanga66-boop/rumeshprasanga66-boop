<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Animated 3D cube representing AI, web and LLM skills">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#67e8f9;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#083344"/></linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>

  <circle cx="160" cy="160" r="120" fill="url(#halo)"><animate attributeName="r" values="108;126;108" dur="5s" repeatCount="indefinite"/></circle>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 160 165;7 160 165;-7 160 165" dur="7s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="282" rx="86" ry="17" fill="#000" opacity=".35"/>

    <polygon points="160,45 278,110 160,175 42,110" fill="url(#top)" stroke="#e9d5ff" stroke-width="1.5"/>
    <polygon points="42,110 160,175 160,285 42,220" fill="url(#left)" stroke="#a78bfa" stroke-width="1.5"/>
    <polygon points="278,110 160,175 160,285 278,220" fill="url(#right)" stroke="#67e8f9" stroke-width="1.5"/>

    <text x="160" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">AI</text>
    <text x="99" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f5f3ff">WEB</text>
    <text x="221" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ecfeff">LLM</text>

    <polyline points="42,110 160,175 278,110" fill="none" stroke="#fff" stroke-width="1" opacity=".45">
      <animate attributeName="opacity" values=".2;.75;.2" dur="3.5s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <g fill="#22d3ee" filter="url(#softGlow)">
    <circle cx="46" cy="74" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="64" r="4"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="250" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="38" cy="252" r="4"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
