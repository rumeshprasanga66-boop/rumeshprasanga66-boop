<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Rumesh - Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#2a0f4a;#052033;#0b1020" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#161035">
        <animate attributeName="stop-color" values="#161035;#0b2340;#2a0f4a;#161035" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#052033">
        <animate attributeName="stop-color" values="#052033;#1b1040;#0b1020;#052033" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0%" stop-color="#a855f7" stop-opacity=".85"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0abfc"><animate attributeName="stop-color" values="#f0abfc;#67e8f9;#a7f3d0;#fde68a;#f0abfc" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#a7f3d0;#fde68a;#f0abfc;#67e8f9" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a7f3d0"><animate attributeName="stop-color" values="#a7f3d0;#fde68a;#f0abfc;#67e8f9;#a7f3d0" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="avatarClip"><circle cx="600" cy="150" r="62"/></clipPath>
    <clipPath id="typingClip"><rect x="390" y="326" width="0" height="34" rx="4"><animate attributeName="width" values="0;420;420;0" keyTimes="0;0.55;0.9;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <circle cx="120" cy="60" r="180" fill="url(#orbA)"><animateTransform attributeName="transform" type="translate" values="0 0;40 -30;0 0" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="400" r="210" fill="url(#orbB)"><animateTransform attributeName="transform" type="translate" values="0 0;-45 35;0 0" dur="11s" repeatCount="indefinite"/></circle>

  <g opacity=".55" stroke="#7c3aed" fill="none">
    <path d="M90 380 Q300 250 470 330 T900 290 T1140 380" stroke-width="1">
      <animate attributeName="stroke-dasharray" values="8 14;24 8;8 14" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="600" cy="150" r="76" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="76;82;76" dur="4s" repeatCount="indefinite"/>
  </circle>
  <image href="data:image/jpeg;base64," x="538" y="88" width="124" height="124" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
  <circle cx="600" cy="150" r="62" fill="none" stroke="#a78bfa" stroke-width="3" opacity=".85"/>

  <text x="600" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#title)">Hi, I'm Rumesh!</text>
  <text x="600" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="3" fill="#c4b5fd">FULL-STACK &amp; AI ENGINEER · TIMISOARA, ROMANIA</text>

  <rect x="378" y="320" width="444" height="44" rx="12" fill="#0f172a" fill-opacity=".65" stroke="#334155"/>
  <text x="600" y="350" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" fill="#a5f3fc" clip-path="url(#typingClip)">React · Next.js · Python · PyTorch · LLMs</text>
  <line x1="600" y1="322" x2="600" y2="360" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
  </line>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="410" y="386" width="118" height="32" rx="16" fill="#7c3aed" fill-opacity=".35" stroke="#a78bfa"/><text x="469" y="407" text-anchor="middle" fill="#ede9fe">OPEN TO WORK</text>
    <rect x="541" y="386" width="118" height="32" rx="16" fill="#0891b2" fill-opacity=".35" stroke="#67e8f9"/><text x="600" y="407" text-anchor="middle" fill="#cffafe">AI / LLM</text>
    <rect x="672" y="386" width="118" height="32" rx="16" fill="#059669" fill-opacity=".35" stroke="#6ee7b7"/><text x="731" y="407" text-anchor="middle" fill="#d1fae5">FULL STACK</text>
  </g>
</svg>
